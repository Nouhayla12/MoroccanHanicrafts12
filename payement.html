<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Moroccan Handicrafts</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Payment</h1>
        <p>Complete your order and pay securely.</p>
    </header>

    <!-- Payment Form -->
    <section class="payment-form">
        <h2>Payment Information</h2>
        <form id="payment-form" onsubmit="storeOrderDetails(event)">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="address">Shipping Address:</label>
            <input type="text" id="address" name="address" required>

            <label for="cardType">Card Type:</label>
            <div class="card-type">
                <label for="visa">
                    <input type="radio" id="visa" name="cardType" value="Visa" required>
                    <img src="photos/visa.png" alt="Visa" class="card-icon">
                </label>
                <label for="mastercard">
                    <input type="radio" id="mastercard" name="cardType" value="MasterCard" required>
                    <img src="photos/master.png" alt="MasterCard" class="card-icon">
                </label>
                <label for="amex">
                    <input type="radio" id="amex" name="cardType" value="American Express" required>
                    <img src="photos/amer.png" alt="American Express" class="card-icon">
                </label>
                <label for="discover">
                    <input type="radio" id="discover" name="cardType" value="Discover" required>
                    <img src="photos/discover.png" alt="Discover" class="card-icon">
                </label>
            </div>

            <label for="cardNumber">Card Number:</label>
            <input type="text" id="cardNumber" name="cardNumber" required>

            <label for="expiryDate">Expiration Date:</label>
            <input type="text" id="expiryDate" name="expiryDate" required>

            <label for="cvv">CVV:</label>
            <input type="text" id="cvv" name="cvv" required>

            <button type="submit" class="btn">Pay Now</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2024 Moroccan Handicrafts. All rights reserved.</p>
    </footer>

<script>
    // Function to store order details in sessionStorage
    function storeOrderDetails(event) {
        event.preventDefault(); // Prevent the form from submitting by default
        
        // Retrieve form values
        const fullName = document.getElementById("fullName").value;
        const address = document.getElementById("address").value;
        const cardType = document.querySelector('input[name="cardType"]:checked').value;

        // Store the information in sessionStorage
        sessionStorage.setItem('fullName', fullName);
        sessionStorage.setItem('address', address);
        sessionStorage.setItem('cardType', cardType);

        // Example product (this can be dynamic based on your cart)
        const productName = "Berber Rug 1";
        const productPrice = 150;

        sessionStorage.setItem('productName', productName);
        sessionStorage.setItem('productPrice', productPrice);

        // Redirect to the confirmation page
        window.location.href = "confirmation.html"; // Ensure this page exists
    }
</script>

</body>
</html>
