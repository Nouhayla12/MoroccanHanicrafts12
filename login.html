<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css"> <!-- Lien vers le fichier CSS -->
    <script>
        function checkPassword(event) {
            event.preventDefault();
            const password = document.getElementById("password").value;

            // Vérifier le mot de passe correct
            if (password === "DroitPub2024") {
                sessionStorage.setItem("authenticated", "true"); // Session valable uniquement jusqu'à la fermeture du navigateur
                window.location.href = "index.html"; // Redirige vers la page principale
            } else {
                alert("Mot de passe incorrect. Réessayez !");
                document.getElementById("password").value = ""; // Effacer le champ de mot de passe
            }
        }
    </script>
</head>
<body>
    <h1>Accès protégé</h1>
    <form onsubmit="checkPassword(event)">
        <label for="password">Mot de passe :</label>
        <input type="password" id="password" required>
        <button type="submit">Entrer</button>
    </form>
</body>
</html>
